<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>مسابقه بازر | Buzzer Arena</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root {
  --bg-deep: #050811;
  --panel-bg: rgba(13, 20, 36, 0.78);
  --panel-border: rgba(148, 163, 184, 0.16);
  --panel-glow: rgba(56, 189, 248, 0.1);
  --primary: #38bdf8;
  --primary-glow: rgba(56, 189, 248, 0.45);
  --accent-ok: #10b981;
  --accent-no: #f43f5e;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --c: #38bdf8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: Vazirmatn, Tahoma, sans-serif;
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.14) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
    radial-gradient(at 50% 50%, #0a1122 0%, var(--bg-deep) 100%);
  color: var(--text-main);
  min-height: 100vh;
  padding: 20px 16px;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

.wrap {
  position: relative;
  z-index: 2;
  max-width: 680px;
  margin: 0 auto;
}

.svg-icon {
  display: inline-block;
  width: 1.25em;
  height: 1.25em;
  fill: currentColor;
  vertical-align: middle;
  flex-shrink: 0;
}

/* هدر بازی */
.game-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 22px;
  padding: 8px 0;
}

.game-header .header-logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0284c7, #38bdf8);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
  color: #031120;
}

.game-header h1 {
  font-size: 1.6rem;
  font-weight: 900;
  background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* پنل‌های شیشه‌ای */
.card {
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
}

.card h3 {
  font-size: 1.05rem;
  font-weight: 800;
  color: #e2e8f0;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* فرم‌ها */
.input-group { position: relative; margin-bottom: 12px; }
input {
  width: 100%;
  font: inherit;
  background: rgba(8, 14, 26, 0.85);
  color: #fff;
  border: 1.5px solid rgba(148, 163, 184, 0.22);
  border-radius: 14px;
  padding: 14px 16px;
  font-weight: 600;
  text-align: center;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: all 0.25s ease;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

/* دکمه‌ها */
button {
  font: inherit;
  font-weight: 700;
  border-radius: 14px;
  padding: 14px 20px;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  position: relative;
  transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
  background: linear-gradient(180deg, #38bdf8, #0284c7);
  color: #041226;
  box-shadow: 0 4px 0 #0369a1, 0 10px 20px rgba(2, 132, 199, 0.35);
}

button:hover:not(:disabled) { filter: brightness(1.1); }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #0369a1; }

button.sec {
  background: linear-gradient(180deg, #334155, #1e293b);
  color: #f1f5f9;
  border: 1px solid rgba(148, 163, 184, 0.18);
  box-shadow: 0 4px 0 #0f172a, 0 6px 16px rgba(0, 0, 0, 0.35);
}
button.sec:active:not(:disabled) { box-shadow: 0 1px 0 #0f172a; }

button.ok {
  background: linear-gradient(180deg, #22c55e, #15803d);
  color: #03220e;
  box-shadow: 0 4px 0 #14532d, 0 8px 18px rgba(34, 197, 94, 0.3);
}
button.ok:active:not(:disabled) { box-shadow: 0 1px 0 #14532d; }

button.no {
  background: linear-gradient(180deg, #f43f5e, #be123c);
  color: #fff;
  box-shadow: 0 4px 0 #881337, 0 8px 18px rgba(244, 63, 94, 0.3);
}
button.no:active:not(:disabled) { box-shadow: 0 1px 0 #881337; }

button:disabled {
  opacity: 0.35;
  filter: grayscale(0.8);
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* نوار بالا */
#bar {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 50;
  display: flex;
  gap: 10px;
}

#mute, #leave {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  padding: 0;
  margin: 0;
  background: rgba(30, 41, 59, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(148, 163, 184, 0.25);
  color: #f8fafc;
}

/* بورد سوالات */
.board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.board button {
  padding: 18px 0;
  font-size: 1.15rem;
  font-weight: 800;
  background: linear-gradient(180deg, #1e293b, #0f172a);
  color: var(--primary);
  border: 1px solid rgba(56, 189, 248, 0.3);
  box-shadow: 0 3px 0 #020617;
}

.code-box {
  background: rgba(6, 11, 23, 0.8);
  border: 1.5px dashed var(--primary);
  border-radius: 14px;
  padding: 14px;
  margin: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.code {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: 0.35em;
  direction: ltr;
  color: var(--primary);
  text-shadow: 0 0 20px var(--primary-glow);
}

/* ردیف امتیازات و نشان حیوان */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(148, 163, 184, 0.08);
  margin-bottom: 6px;
  transition: transform 0.2s, background 0.3s;
}

.row.first {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.4);
  color: #34d399;
  font-weight: 800;
}

.row.bump { background: rgba(245, 158, 11, 0.22); }

.animal-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  margin-inline-end: 10px;
  background: color-mix(in srgb, var(--c) 20%, transparent);
  border: 1px solid var(--c);
  color: var(--c);
  box-shadow: 0 0 10px var(--c);
}

.animal-badge svg { width: 18px; height: 18px; fill: currentColor; }

.status {
  text-align: center;
  font-size: 1.15rem;
  font-weight: 700;
  min-height: 2.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e2e8f0;
}

/* تایمر */
.timer {
  height: 8px;
  border-radius: 999px;
  background: #1e293b;
  overflow: hidden;
  margin: 8px 0 14px;
}

.timer i {
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #06b6d4, #38bdf8);
  box-shadow: 0 0 10px #38bdf8;
}

.timer i.low {
  background: linear-gradient(90deg, #f43f5e, #e11d48);
  animation: pulse 0.3s ease-in-out infinite alternate;
}

/* بازر حیوانی اصلی */
.bz-wrap {
  width: min(76vw, 300px);
  height: min(76vw, 300px);
  margin: 24px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bz-wrap::after {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--c) 0%, transparent 70%);
  opacity: 0.35;
  filter: blur(14px);
  pointer-events: none;
  animation: patronus-breathe 3s ease-in-out infinite alternate;
}

#buzz {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  margin: 0;
  padding: 0;
  border: 3px solid color-mix(in srgb, var(--c) 70%, #ffffff);
  background: 
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.22) 0%, transparent 65%),
    linear-gradient(145deg, color-mix(in srgb, var(--c) 45%, #080f1d), #040711);
  box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 24px var(--c);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  touch-action: manipulation;
  cursor: pointer;
  transition: transform 0.1s ease, filter 0.25s ease;
}

#buzz .animal-spirit {
  width: 52%;
  height: 52%;
  fill: var(--c);
  filter: drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 24px rgba(255,255,255,0.7));
  z-index: 2;
  transition: transform 0.3s ease;
}

#buzz .lbl {
  position: relative;
  z-index: 2;
  font-size: 1.45rem;
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.05em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 14px var(--c);
}

#buzz .beam {
  position: absolute;
  inset: -50%;
  opacity: 0;
  background: conic-gradient(from 0deg, transparent 0 65%, rgba(255, 255, 255, 0.8) 85%, transparent 100%);
}

#buzz.lit .beam { opacity: 1; animation: spin 0.7s linear infinite; }
#buzz.lit { animation: pulse 0.45s ease-in-out infinite alternate; }
#buzz.lit .animal-spirit { transform: scale(1.15); }
#buzz.off { filter: grayscale(0.9) brightness(0.35); cursor: not-allowed; }
#buzz:active:not(:disabled) { transform: scale(0.93); }

/* سوال و گزینه‌ها */
.qtext {
  font-size: 1.25rem;
  font-weight: 800;
  line-height: 1.8;
  margin-bottom: 16px;
  text-align: center;
  color: #ffffff;
}

.opt {
  padding: 14px 16px;
  border: 1.5px solid rgba(148, 163, 184, 0.2);
  border-radius: 14px;
  margin-top: 10px;
  background: rgba(11, 19, 36, 0.65);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 12px;
}

.opt-index {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 800;
}

.opt.right {
  border-color: var(--accent-ok);
  background: rgba(16, 185, 129, 0.16);
  color: #34d399;
}
.opt.dim { opacity: 0.35; }

.fact {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(6, 11, 23, 0.75);
  border-right: 3px solid var(--primary);
  line-height: 1.8;
  font-size: 0.95rem;
  color: #cbd5e1;
}

.res { text-align: center; margin-top: 14px; font-weight: 800; font-size: 1.1rem; }

/* سکوی قهرمانی */
.podium {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 12px;
  margin: 30px 0 20px;
}

.pod {
  flex: 1;
  text-align: center;
  padding: 16px 8px;
  border-radius: 16px 16px 4px 4px;
  border: 2px solid var(--c);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 25%, #1e293b), #0f172a);
  box-shadow: 0 0 25px color-mix(in srgb, var(--c) 25%, transparent);
  animation: rise 0.8s cubic-bezier(0.2, 1.3, 0.4, 1) backwards;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.pod .pm-icon {
  width: 32px;
  height: 32px;
  margin: 0 auto 8px;
  fill: var(--c);
  filter: drop-shadow(0 0 8px var(--c));
}

.p1 { min-height: 200px; animation-delay: 0.8s; }
.p2 { min-height: 155px; animation-delay: 0.4s; }
.p3 { min-height: 125px; }

/* پرده ظهور جادویی (Patronus Reveal) */
#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c, #38bdf8) 35%, #050b14), #020409 75%);
}

#intro::before {
  content: "";
  position: absolute;
  inset: -60%;
  background: repeating-conic-gradient(rgba(255, 255, 255, 0.06) 0 8deg, transparent 8deg 16deg);
  animation: spin 26s linear infinite;
}

.patronus-stage {
  position: relative;
  z-index: 2;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.patronus-orb {
  width: min(65vw, 240px);
  height: min(65vw, 240px);
  border-radius: 50%;
  border: 3px solid color-mix(in srgb, var(--c) 80%, #fff);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%), #040813;
  box-shadow: 0 0 45px var(--c), inset 0 0 35px var(--c);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin: 18px 0;
  transition: transform 0.15s ease, filter 0.15s ease;
}

.patronus-orb svg {
  width: 62%;
  height: 62%;
  fill: var(--c);
  filter: drop-shadow(0 0 16px var(--c)) drop-shadow(0 0 30px #ffffff);
  transition: transform 0.1s ease, filter 0.1s ease;
}

/* انیمیشن جهش و تغییر شکل حیوان حین رولت */
.patronus-orb.morph {
  transform: scale(0.85);
  filter: blur(2px) brightness(1.7);
}

.patronus-orb.manifest {
  animation: patronus-manifest 0.9s cubic-bezier(0.18, 1.35, 0.35, 1) forwards;
}

/* موج انرژی انفجاری بعد از فیکس شدن حیوان */
.shockwave {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--c);
  pointer-events: none;
  opacity: 0;
}
.patronus-orb.manifest .shockwave {
  animation: shockwave-fire 0.8s ease-out forwards;
}

@keyframes patronus-manifest {
  0% { transform: scale(0.4); filter: brightness(3); }
  60% { transform: scale(1.18); filter: drop-shadow(0 0 50px var(--c)) brightness(1.6); }
  100% { transform: scale(1); filter: drop-shadow(0 0 30px var(--c)) brightness(1); }
}

@keyframes shockwave-fire {
  0% { transform: scale(0.9); opacity: 1; }
  100% { transform: scale(2.2); opacity: 0; border-width: 1px; }
}

@keyframes patronus-breathe {
  from { transform: scale(0.92); opacity: 0.3; }
  to { transform: scale(1.08); opacity: 0.55; }
}

/* انیمیشن‌ها و پایه‌ها */
.hide { display: none !important; }
.err { color: #fb7185; text-align: center; margin-top: 10px; font-weight: 700; font-size: 0.95rem; }
.warn { text-align: center; color: #fbbf24; border-color: rgba(251, 191, 36, 0.4); background: rgba(245, 158, 11, 0.1); }

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 10;
  background: radial-gradient(circle at center, transparent 30%, var(--c, #f00) 140%);
}
body.alarm #flash { animation: siren 0.6s ease-in-out infinite alternate; }

.float {
  position: absolute;
  inset-inline-start: 45%;
  top: -4px;
  font-weight: 900;
  font-size: 1.6rem;
  pointer-events: none;
  animation: fl 1.3s ease-out forwards;
}
.float.up { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.6); }
.float.dn { color: #fb7185; text-shadow: 0 0 10px rgba(251, 113, 133, 0.6); }

.cf {
  position: fixed;
  top: -14px;
  width: 10px;
  height: 14px;
  z-index: 60;
  pointer-events: none;
  animation: cf 1.9s ease-in forwards;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.4); } }
@keyframes siren { from { opacity: 0.1; } to { opacity: 0.75; } }
@keyframes rise { from { transform: translateY(80px); opacity: 0; } }
@keyframes fl { to { transform: translateY(-40px); opacity: 0; } }
@keyframes cf { to { transform: translate(var(--dx), 108vh) rotate(720deg); } }
body.shake .wrap { animation: shake 0.45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
</style>
</head>

    <!-- حیوانات پاترونوس (۱۰ روح با فرم‌های نمادین) -->

<script src="/socket.io/socket.io.js"></script>
<script>
const sock = io('/buzzer');
const $ = (id) => document.getElementById(id);
const VALUES = [100,200,300,400,500,600,700,800,900,1000];
const BUZZ_SECONDS = 4.5;
const ANSWER_MS = 10000;
const rnd = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ۱۰ حیوان پاترونوس با مشخصات صوتی، نوری و وکتور */
const PATRONUS = [
  { id: 'patronus-eagle',   name: 'عقاب صاعقه',     color: '#ef4444', noteFreq: 880 },
  { id: 'patronus-wolf',    name: 'گرگ کهکشانی',    color: '#f97316', noteFreq: 660 },
  { id: 'patronus-lion',    name: 'شیر طلایی',       color: '#facc15', noteFreq: 523 },
  { id: 'patronus-dragon',  name: 'اژدهای زمرد',    color: '#10b981', noteFreq: 440 },
  { id: 'patronus-falcon',  name: 'شاهین فیروزه',   color: '#06b6d4', noteFreq: 784 },
  { id: 'patronus-bear',    name: 'خرس تیتانیوم',   color: '#3b82f6', noteFreq: 330 },
  { id: 'patronus-fox',     name: 'روباه اسرارآمیز', color: '#a855f7', noteFreq: 587 },
  { id: 'patronus-panther', name: 'پلنگ کیهانی',    color: '#ec4899', noteFreq: 494 },
  { id: 'patronus-swan',    name: 'قوی نقره‌ای',     color: '#e2e8f0', noteFreq: 698 },
  { id: 'patronus-stag',    name: 'گوزن سپیده‌دم',   color: '#84cc16', noteFreq: 622 }
];

const colorize = (el, i) => el.style.setProperty('--c', PATRONUS[i % 10].color);

function animalBadge(i) {
  const p = PATRONUS[i % 10];
  const s = document.createElement('span');
  s.className = 'animal-badge';
  s.style.setProperty('--c', p.color);
  s.innerHTML = `<svg><use href="#${p.id}"/></svg>`;
  return s;
}

/* سیستم تولید صوت و نغمه‌های زنده (WebAudio) */
let AC = null;
function ctx() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
let muted = localStorage.getItem('bz_mute') === '1';
const paintMute = () => {
  $('mute-icon').firstElementChild.setAttribute('href', muted ? '#icon-vol-off' : '#icon-vol-on');
};
$('mute').onclick = () => {
  muted = !muted;
  localStorage.setItem('bz_mute', muted ? '1' : '0');
  paintMute();
  if (muted) stopBuzzSound(); else ctx();
};
paintMute();
document.addEventListener('pointerdown', () => { try { ctx(); } catch {} }, { once: true });

function tone(f, t, d, type = 'sine', v, f2, dest) {
  if (muted) return;
  const c = ctx(), t0 = c.currentTime + t;
  const o = c.createOscillator(), g = c.createGain();
  const vol = v ?? ((type === 'square' || type === 'sawtooth') ? 0.12 : 0.25);
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(dest || c.destination);
  o.start(t0); o.stop(t0 + d + 0.02);
}

const SND = [
  [[880,0,.18,'square'],[660,.18,.18,'square'],[880,.36,.18,'square'],[660,.54,.18,'square']],
  [[1318,0,.7,'sine'],[1976,0,.5,'sine'],[1318,.25,.7,'sine'],[1976,.25,.5,'sine']],
  [[523,0,.1,'triangle'],[659,.08,.1,'triangle'],[784,.16,.1,'triangle'],[1047,.24,.35,'triangle']],
  [[1568,0,.12,'sine'],[2093,.1,.4,'sine']],
  [[1800,0,.45,'sawtooth',200]],
  [[220,0,.1,'square'],[330,.12,.1,'square'],[220,.24,.1,'square'],[440,.36,.2,'square']],
  [[1200,0,.6,'triangle',400],[1500,.05,.6,'triangle',500]],
  [[196,0,.25,'sawtooth'],[247,0,.25,'sawtooth'],[196,.32,.25,'sawtooth'],[247,.32,.25,'sawtooth']],
  [[1000,0,.08,'sine'],[1000,.14,.08,'sine'],[1000,.28,.08,'sine']],
  [[160,0,.35,'sine',40],[80,0,.35,'sine',30]],
];

let bzBus = null;
function stopBuzzSound() {
  if (!bzBus) return;
  const b = bzBus; bzBus = null;
  try { b.gain.cancelScheduledValues(0); b.gain.setTargetAtTime(0, ctx().currentTime, 0.03); } catch {}
  setTimeout(() => { try { b.disconnect(); } catch {} }, 400);
}
function playBuzzer(i, secs = BUZZ_SECONDS) {
  if (muted) return;
  stopBuzzSound();
  const c = ctx();
  const bus = c.createGain();
  bus.connect(c.destination);
  bzBus = bus;

  const pat = SND[i % 10];
  const len = Math.max(...pat.map(([, t, d]) => t + d)) + 0.25;
  const reps = Math.max(1, Math.ceil(secs / len));
  for (let r = 0; r < reps; r++) {
    pat.forEach(([f, t, d, ty, f2]) => tone(f, t + r * len, d, ty, undefined, f2, bus));
  }
  const end = c.currentTime + secs;
  bus.gain.setValueAtTime(1, Math.max(c.currentTime, end - 0.5));
  bus.gain.linearRampToValueAtTime(0, end);
}

function vibrateLong(secs = BUZZ_SECONDS) {
  if (!navigator.vibrate) return;
  const p = []; let t = 0;
  while (t < secs * 1000) { p.push(450, 150); t += 600; }
  navigator.vibrate(p);
}
function stopVibrate() { if (navigator.vibrate) navigator.vibrate(0); }

let musicTimer = null;
const ARP = [0, 4, 7, 12, 7, 4, 0, 4];
const ROOTS = [220, 174.6, 196, 164.8];
function startMusic() {
  stopMusic();
  let s = 0;
  musicTimer = setInterval(() => {
    const root = ROOTS[(s >> 3) % 4];
    tone(root * 2 * Math.pow(2, ARP[s % 8] / 12), 0, .14, 'triangle', .07);
    if (s % 4 === 0) tone(root / 2, 0, .3, 'sine', .12);
    s++;
  }, 170);
}
function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

/* وضعیت و اتصال */
let token = sessionStorage.getItem('bz_token');
if (!token) { token = rnd(); sessionStorage.setItem('bz_token', token); }
let me = JSON.parse(sessionStorage.getItem('bz_me') || 'null');
let st = null;
let hostInfo = null;
let introRunning = false;

const show = (n) => {
  ['join','host','player','intro','over'].forEach((x) => $(x).classList.toggle('hide', x !== n));
  $('bar').classList.toggle('hide', n === 'join');
  if (n !== 'player') document.body.classList.remove('alarm');
};
const save = (m) => { me = m; sessionStorage.setItem('bz_me', JSON.stringify(m)); };

sock.on('connect', () => {
  if (introRunning) return;
  if (!me) return show('join');
  sock.emit('resume', { token, code: me.code }, (r) => {
    if (r && r.ok) {
      me.id = r.id;
      if (me.role === 'host') $('hCode').textContent = me.code;
      show(me.role);
      render();
    } else {
      sessionStorage.removeItem('bz_me');
      me = null;
      show('join');
    }
  });
});

$('createBtn').onclick = () => sock.emit('host:create', { token }, (r) => {
  if (r && r.ok) {
    save({ role: 'host', code: r.code });
    $('hCode').textContent = r.code;
    show('host');
  }
});

$('joinBtn').onclick = () => {
  try { ctx(); } catch {}
  sock.emit('player:join', { token, code: $('inCode').value, name: $('inName').value }, (r) => {
    if (!r || !r.ok) { $('err').textContent = (r && r.error) || 'خطا در ارتباط'; return; }
    save({ role: 'player', code: r.code, id: r.id, bz: r.bz != null ? r.bz : 0 });
    runIntro(me.bz);
  });
};

function leaveRoom() {
  stopMusic(); stopBuzzSound(); stopVibrate();
  introRunning = false;
  sessionStorage.removeItem('bz_me');
  me = null; st = null; hostInfo = null;
  document.body.classList.remove('alarm');
  show('join');
}
function askLeave() {
  const msg = me && me.role === 'host' ? 'اتاق بسته می‌شود و همه خارج می‌شوند. ادامه می‌دهید؟' : 'از بازی خارج می‌شوید؟';
  if (!confirm(msg)) return;
  sock.emit('leave');
  leaveRoom();
}
$('leave').onclick = askLeave;
document.querySelectorAll('.leaveBtn').forEach((b) => { b.onclick = askLeave; });
sock.on('closed', () => {
  if (!me) return;
  leaveRoom();
  alert('اتاق توسط مجری بسته شد.');
});

/* پروسه انتخاب جادویی و رولت انیمیشنی حیوانات */
function runIntro(targetIndex) {
  introRunning = true;
  show('intro');
  $('introTitle').textContent = 'در حال جستجو و اتصال به پاترونوس شما...';
  $('introName').textContent = '';
  $('introBtns').classList.add('hide');
  
  const orb = $('introOrb');
  orb.className = 'patronus-orb';
  startMusic();

  const totalSteps = 24; // تعداد دور چرخش
  let currentStep = 0;

  function nextStep() {
    // حیوان فعلی در چرخش
    const isFinal = currentStep >= totalSteps;
    const animalIdx = isFinal ? targetIndex : Math.floor(Math.random() * 10);
    const pet = PATRONUS[animalIdx];

    // تغییر رنگ و آیکون با افکت مات‌شدن سریع (Morphing)
    colorize($('intro'), animalIdx);
    colorize(orb, animalIdx);
    $('introSvg').firstElementChild.setAttribute('href', `#${pet.id}`);

    // انیمیشن پرش و شوک بین تغییر حیوانات
    orb.classList.add('morph');
    setTimeout(() => orb.classList.remove('morph'), 45);

    // صدای نغمه جادویی متناسب با فرکانس هر حیوان
    tone(pet.noteFreq, 0, 0.05, 'triangle', 0.12);

    if (isFinal) {
      revealPatronus(targetIndex);
    } else {
      currentStep++;
      // کاهش شتاب چرخش به‌صورت نمایی
      const delay = 45 + Math.pow(currentStep / totalSteps, 2.5) * 320;
      setTimeout(nextStep, delay);
    }
  }

  nextStep();
}

function revealPatronus(i) {
  const pet = PATRONUS[i % 10];
  const orb = $('introOrb');

  // تحریک انیمیشن تجلی نهایی و انتشار موج Shockwave
  void orb.offsetWidth;
  orb.classList.add('manifest');

  $('introTitle').textContent = 'روح حامی شما متجلی شد:';
  $('introName').textContent = pet.name;

  // ترومپت درخشان پاترونوس
  [440, 554, 659, 880, 1108].forEach((f, k) => tone(f, k * 0.09, 1.1, 'sine', 0.22));
  setTimeout(() => playBuzzer(i, 1.8), 500);

  $('introBtns').classList.remove('hide');
}

$('testBtn').onclick = () => { playBuzzer(me.bz || 0); vibrateLong(1.5); };
$('goBtn').onclick = () => {
  stopMusic(); stopBuzzSound(); stopVibrate();
  introRunning = false;
  show('player');
  render();
};

VALUES.forEach((v) => {
  const b = document.createElement('button');
  b.textContent = v; b.dataset.v = v;
  b.onclick = () => sock.emit('host:activate', { value: v }, (r) => {
    if (r && !r.ok && r.error) alert(r.error);
  });
  $('board').appendChild(b);
});
$('okBtn').onclick   = () => sock.emit('host:judge', { correct: true });
$('noBtn').onclick   = () => sock.emit('host:judge', { correct: false });
$('skipBtn').onclick = () => sock.emit('host:skip');

$('buzz').addEventListener('pointerdown', (e) => {
  if (e.currentTarget.disabled) return;
  playBuzzer(me.bz || 0);
  vibrateLong();
  sock.emit('player:buzz');
});

const row = (a, b, cls, bz) => {
  const d = document.createElement('div'); d.className = 'row' + (cls ? ' ' + cls : '');
  const x = document.createElement('span');
  x.style.display = 'inline-flex';
  x.style.alignItems = 'center';
  if (bz != null) x.append(animalBadge(bz));
  const txt = document.createElement('span');
  txt.textContent = a;
  x.append(txt);
  const y = document.createElement('span'); y.textContent = b;
  d.append(x, y); return d;
};
const pl = (id) => st.players.find((p) => p.id === id) || {};

function renderScores(box) {
  const sorted = [...st.players].sort((a, b) => b.score - a.score);
  const before = new Map([...box.children].map((r) => [r.dataset.id, r.getBoundingClientRect().top]));
  box.replaceChildren(...sorted.map((p) => {
    const r = row((p.online ? '' : '[آفلاین] ') + p.name, '', '', p.bz);
    r.dataset.id = p.id;
    const b = document.createElement('b');
    b.style.fontSize = '1.15rem';
    b.style.fontVariantNumeric = 'tabular-nums';
    r.lastChild.append(b);
    const from = shown[p.id] ?? p.score; shown[p.id] = p.score;
    countTo(b, from, p.score);
    if (from !== p.score) { r.classList.add('bump'); setTimeout(() => r.classList.remove('bump'), 1200); }
    return r;
  }));
  [...box.children].forEach((r) => {
    const o = before.get(r.dataset.id); if (o == null) return;
    const d = o - r.getBoundingClientRect().top;
    if (d) r.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.9,.3,1)' });
  });
}

function renderQ(box, isHost) {
  if (!st.q) { box.classList.add('hide'); return; }
  box.classList.remove('hide');

  const live = isHost && hostInfo;
  const ans  = st.reveal ? st.reveal.answer : (live ? hostInfo.answer : -1);
  const fact = st.reveal ? st.reveal.fact   : (live ? hostInfo.fact   : '');

  const parts = [];
  const h = document.createElement('div');
  h.className = 'qtext'; h.textContent = st.q.text;
  parts.push(h);

  st.q.options.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'opt' + (i === ans ? ' right' : (st.reveal ? ' dim' : ''));
    
    const tag = document.createElement('span');
    tag.className = 'opt-index';
    tag.textContent = ['۱', '۲', '۳', '۴'][i];
    
    const label = document.createElement('span');
    label.textContent = t;

    d.append(tag, label);
    parts.push(d);
  });

  if (st.reveal) {
    const r = document.createElement('div');
    r.className = 'res';
    r.style.color = st.reveal.by ? 'var(--accent-ok)' : 'var(--accent-no)';
    r.textContent = st.reveal.by
      ? `پاسخ صحیح توسط ${pl(st.reveal.by).name || 'کاربر'} ثبت شد`
      : 'پاسخ صحیحی ثبت نشد';
    parts.push(r);
  }
  if (fact) {
    const f = document.createElement('div');
    f.className = 'fact';
    f.textContent = (isHost && !st.reveal ? 'یادداشت راهنما: ' : 'اطلاعات عمومی: ') + fact;
    parts.push(f);
  }
  box.replaceChildren(...parts);
}

function render() {
  if (!st || !me) return;
  if (st.over) {
    if (!overShown) { overShown = true; setTimeout(() => { if (st && st.over && !introRunning) { show('over'); confetti(70); } }, 4500); }
  } else {
    overShown = false;
    if (!$('over').classList.contains('hide')) show(me.role);
  }
  if (!$('over').classList.contains('hide')) renderOver();

  if (me.role === 'host') {
    $('hCode').textContent = st.code;
    document.querySelectorAll('#board button').forEach((b) => {
      b.disabled = st.used.includes(+b.dataset.v) || st.phase !== 'idle';
    });
    $('hStatus').textContent =
      st.phase === 'idle' ? 'یک سوال را انتخاب کنید'
      : st.phase === 'open' ? `سوال ${st.active} امتیازی فعال است — منتظر بازر`
      : `نوبت پاسخ: ${pl(st.queue[0]).name || '؟'}`;
    $('hQueue').replaceChildren(...st.queue.map((id, i) =>
      row(`${i + 1}. ${pl(id).name || '؟'}`, pl(id).rt != null ? sec(pl(id).rt) : '', i === 0 ? 'first' : '', pl(id).bz)));
    $('okBtn').disabled = $('noBtn').disabled = st.phase !== 'answering';
    $('skipBtn').disabled = st.phase === 'idle';
    renderQ($('hQ'), true);
    renderScores($('hScores'));
  } else {
    const b = me.bz != null ? me.bz : 0;
    const pet = PATRONUS[b % 10];
    colorize($('buzzWrap'), b);
    colorize($('buzz'), b);
    colorize($('flash'), b);
    $('buzzIcon').firstElementChild.setAttribute('href', `#${pet.id}`);
    $('offline').classList.toggle('hide', st.hostOnline !== false);

    const idx = st.queue.indexOf(me.id);
    const tried = st.tried.includes(me.id);
    let txt;
    if (st.phase === 'idle') txt = 'در انتظار سوال بعدی توسط مجری...';
    else if (idx === 0) txt = `نوبت توست! روح ${pet.name} پیشتاز شد` + (pl(me.id).rt != null ? ' (' + sec(pl(me.id).rt) + ')' : '');
    else if (idx > 0) txt = `شما در نوبت شماره ${idx + 1} صف هستید`;
    else if (tried) txt = 'پاسخ شما اشتباه ثبت شد';
    else if (st.queue.length) txt = `${pl(st.queue[0]).name || 'بازیکن'} در حال پاسخگویی است`;
    else txt = `سوال ${st.active} امتیازی فعال است — بازر حامی خود را فعال کن!`;
    $('pStatus').textContent = txt;

    if (st.phase === 'idle' || tried) { stopBuzzSound(); stopVibrate(); }

    const disabled = st.phase === 'idle' || idx >= 0 || tried;
    $('buzz').disabled = disabled;
    $('buzz').classList.toggle('lit', idx >= 0);
    $('buzz').classList.toggle('off', disabled && idx < 0);
    document.body.classList.toggle('alarm', idx === 0 && !introRunning);
    renderQ($('pQ'), false);
    renderScores($('pScores'));
  }
}

let overShown = false;
const shown = {};
const sec = (ms) => (ms / 1000).toFixed(2) + ' ثانیه';
function countTo(el, from, to) {
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const f = (t) => { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function confetti(n = 36) {
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i'); c.className = 'cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = PATRONUS[Math.floor(Math.random() * 10)].color;
    c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    c.style.animationDelay = Math.random() * .4 + 's';
    document.body.append(c); setTimeout(() => c.remove(), 2500);
  }
}
function sfx(ok) {
  if (ok) [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * .08, .5, 'triangle', .2));
  else { tone(220, 0, .55, 'sawtooth', .14, 90); tone(165, .12, .5, 'square', .08, 70); }
}
function runTimer() {
  document.querySelectorAll('.timer').forEach((t) => {
    clearTimeout(t._lt);
    const i = t.firstChild, on = st && st.dl != null && st.phase === 'answering';
    t.classList.toggle('hide', !on); if (!on) return;
    i.classList.remove('low'); i.style.transition = 'none';
    i.style.width = (st.dl / ANSWER_MS * 100) + '%'; void i.offsetWidth;
    i.style.transition = `width ${st.dl}ms linear`; i.style.width = '0%';
    t._lt = setTimeout(() => i.classList.add('low'), Math.max(0, st.dl - 3000));
  });
}
sock.on('judged', ({ id, correct, delta }) => {
  if (!me) return;
  const r = document.querySelector(`.row[data-id="${id}"]`);
  if (r) {
    const f = document.createElement('span');
    f.className = 'float ' + (correct ? 'up' : 'dn');
    f.textContent = (delta > 0 ? '+' : '') + delta;
    r.append(f); setTimeout(() => f.remove(), 1300);
  }
  sfx(correct);
  if (correct) { confetti(); setTimeout(() => navigator.vibrate && navigator.vibrate([80, 40, 80]), 80); }
  else { document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 500); }
});

function renderOver() {
  const s = [...st.players].sort((a, b) => b.score - a.score);
  $('podium').replaceChildren(...[1, 0, 2].filter((i) => s[i]).map((i) => {
    const d = document.createElement('div'); d.className = 'pod p' + (i + 1); colorize(d, s[i].bz);
    
    const crownWrap = document.createElement('div');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'pm-icon');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#icon-crown');
    svg.appendChild(use);
    crownWrap.appendChild(svg);

    const n = document.createElement('div');
    n.style.fontWeight = '700';
    n.append(animalBadge(s[i].bz), s[i].name);

    const sc = document.createElement('b');
    sc.style.fontSize = '1.4rem';
    sc.textContent = s[i].score;

    d.append(crownWrap, n, sc); return d;
  }));
  const fast = s.filter((p) => p.best != null).sort((a, b) => a.best - b.best)[0];
  const most = [...s].sort((a, b) => b.ok - a.ok)[0];
  const lines = [];
  if (fast) lines.push(`سریع‌ترین واکنش: ${fast.name} (${sec(fast.best)})`);
  if (most && most.ok) lines.push(`بیشترین پاسخ صحیح: ${most.name} (${most.ok} پاسخ)`);
  
  $('awards').replaceChildren(...lines.map((t) => {
    const d = document.createElement('div');
    d.className = 'fact';
    d.style.borderColor = 'var(--panel-border)';
    d.style.textAlign = 'center';
    d.textContent = t;
    return d;
  }));
  $('rematchBtn').classList.toggle('hide', me.role !== 'host');
}

$('rematchBtn').onclick = () => sock.emit('host:rematch');
$('copyBtn').onclick = () => {
  const link = location.origin + location.pathname + '?code=' + st.code;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(
    () => {
      const sp = $('copyBtn').querySelector('span');
      sp.textContent = 'کپی شد';
      setTimeout(() => { sp.textContent = 'کپی لینک دعوت'; }, 1500);
    },
    () => prompt('لینک دعوت:', link));
};
const qp = new URLSearchParams(location.search);
if (qp.get('code')) $('inCode').value = qp.get('code').toUpperCase().slice(0, 4);
$('inName').value = localStorage.getItem('bz_name') || '';
$('joinBtn').addEventListener('click', () => localStorage.setItem('bz_name', $('inName').value));

sock.on('hostinfo', (h) => { hostInfo = h; render(); });
sock.on('state', (s) => { st = s; render(); runTimer(); });
</script>
</body>
</html>
